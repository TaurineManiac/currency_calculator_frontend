<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Валют</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>💰 Конвертер Валют</h1>
        <p>Курсы Национального Банка Республики Беларусь</p>
    </header>

    <main>
        <div class="converter-card">
            <div class="input-group">
                <label for="amount">Сумма:</label>
                <input type="number" id="amount" value="100" min="0" step="0.01" placeholder="Введите сумму">
            </div>

            <div class="currency-row">
                <div class="currency-group">
                    <label for="currencyFrom">Из валюты:</label>
                    <select id="currencyFrom"></select>
                </div>

                <button id="swapBtn" class="swap-btn" title="Поменять валюты местами">⇄</button>

                <div class="currency-group to-currency">
                    <label for="currencyTo">В валюту:</label>
                    <select id="currencyTo"></select>
                </div>
            </div>

            <button id="convertBtn" class="convert-btn">Конвертировать</button>

            <div id="result" class="result" style="display: none;">
                <div class="result-amount" id="resultAmount"></div>
                <div class="result-details">
                    <div>Курс: <span id="exchangeRate"></span></div>
                    <div>Дата: <span id="exchangeDate"></span></div>
                </div>
            </div>

            <div id="error" class="error" style="display: none;"></div>
        </div>

        <div class="currencies-card">
            <h3>📊 Доступные валюты</h3>
            <div id="currenciesList" class="currencies-list"></div>
        </div>
    </main>

    <footer>
        <p>Данные предоставлены Национальным Банком РБ</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
